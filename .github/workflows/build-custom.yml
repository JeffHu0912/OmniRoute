# Self-use only: build custom/* branches on hosted runners (zero local RAM).
#
# Upstream source: diegosouzapw/OmniRoute (.github/workflows/docker-publish.yml).
# Differences (deliberate, self-use):
#  - triggers ONLY on custom/* branches (+ manual dispatch); never touches
#    main / release/*, so upstream's own publish flow is unaffected;
#  - single arch (linux/arm64, this Mac) + single target (runner-base):
#    no Docker Hub, no multi-arch manifest, no SBOM/Trivy gates;
#  - pushes ONLY to ghcr.io/<fork-owner>/omniroute:custom-* (never :latest,
#    never the upstream image name);
#  - needs NO secrets: GITHUB_TOKEN (packages: write) is enough.
#
# Usage:
#   git push origin custom/v3.8.51   # auto-builds on push
#   # or: Actions tab -> "Build custom image (self-use)" -> Run workflow
# Result:
#   ghcr.io/<owner>/omniroute:custom-v3.8.51
#   docker pull ghcr.io/<owner>/omniroute:custom-v3.8.51

name: Build custom image (self-use)

on:
  push:
    branches:
      - "custom/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: branch name, e.g. custom-v3.8.51)"
        required: false
        type: string
        default: ""

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push (linux/arm64, runner-base)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          # sanitize: lowercase, keep [a-z0-9._-], max 128 chars (Docker tag rules)
          TAG="$(printf '%s' "$TAG" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | cut -c1-128)"
          # GHCR repository path must be lowercase (owner JeffHu0912 -> jeffhu0912)
          OWNER_LC="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER_LC}/omniroute" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building ghcr.io/${OWNER_LC}/omniroute:$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/arm64
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          push: true
          cache-from: type=gha,scope=custom-build
          cache-to: type=gha,scope=custom-build,mode=max,ignore-error=true
